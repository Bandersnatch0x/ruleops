apiVersion: rulefactory.io/v1
kind: RuleIntent

metadata:
  id: corp.java.no-system-exit
  version: 1.0.0

spec:
  standard:
    id: SEC-JAVA-017
    version: 1.0.0
    scenario: direct-system-exit
  language:
    id: java
    sourceLevels: ["11"]
  intent:
    statement: s
  scope:
    includeSourceSets: [main]
  semantics:
    target:
      kind: method-call
      declaringType: java.lang.System
      method: exit
      invocation: static
      parameters: [int]
  requiredCapabilities: [java.ast]
  unresolved:
    behavior: unknown
  examples:
    bad: ["System.exit(1);"]
    good: ["ok();"]
  severity:
    default: fatal
