apiVersion: rulefactory.io/v1
kind: RuleIntent
metadata:
  id: corp.java.avoid-object-allocation-in-loop
  version: 1.0.0
spec:
  standard:
    id: SEC-JAVA-020
    version: 1.0.0
    scenario: avoid-object-allocation-in-loop
  language:
    id: java
    sourceLevels: ["11", "17", "21"]
  intent:
    statement: 禁止在循环体内重复创建对象
  scope:
    includeSourceSets: [main]
    excludeSourceSets: [test]
  semantics:
    target:
      kind: existing-rule
      declaringType: pmd
      method: category/java/performance.xml/AvoidInstantiatingObjectsInLoops
      invocation: any
      parameters: []
  requiredCapabilities:
    - java.ast
  unresolved:
    behavior: unknown
  examples:
    bad:
      - "for (int i = 0; i < 2; i++) { new String(\"x\"); }"
    good:
      - "String value = \"x\"; for (int i = 0; i < 2; i++) { value.length(); }"
    holdout:
      - "for (int i = 0; i < 2; i++) { new Object(); }"
    nearMiss:
      - "String value = \"x\"; for (int i = 0; i < 2; i++) { value.toString(); }"
  severity:
    default: advisory
