[package]
name = "erf-scan-output"
version = "0.1.0"
edition = "2021"
description = "Deterministic scan result, diagnostic and progress projection"

[dependencies]
erf-host-client = { path = "../host-client" }
erf-incremental-baseline = { path = "../incremental-baseline" }
erf-resolver-client = { path = "../resolver-client" }
erf-thin-client = { path = "../thin-client" }
rf-gate = { path = "../gate" }
rf-runner = { path = "../rf-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "erf_scan_output"
path = "src/lib.rs"
