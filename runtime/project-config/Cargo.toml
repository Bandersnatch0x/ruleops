[package]
name = "erf-project-config"
version = "0.1.0"
edition = "2021"
description = "Fail-closed project configuration, workspace detection and doctor checks"

[dependencies]
erf-bundle-cache = { path = "../bundle-cache" }
erf-trust-state = { path = "../trust-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "erf_project_config"
path = "src/lib.rs"

[[bin]]
name = "erf-project-config"
path = "src/main.rs"
