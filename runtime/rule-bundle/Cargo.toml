[package]
name = "erf-rule-bundle"
version = "0.1.0"
edition = "2021"
description = "Signed content-addressed composition of RuleRelease, PolicyProfile, ExecutionLock and Ontology pack"

[dependencies]
erf-trust = { path = "../trust" }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["std"] }

[lib]
name = "erf_rule_bundle"
path = "src/lib.rs"
