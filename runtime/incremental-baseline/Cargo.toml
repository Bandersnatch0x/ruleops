[package]
name = "erf-incremental-baseline"
version = "0.1.0"
edition = "2021"
description = "Fail-closed incremental fallback, stage telemetry and synthetic performance baseline"

[dependencies]
erf-scan-plan = { path = "../scan-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "erf_incremental_baseline"
path = "src/lib.rs"
