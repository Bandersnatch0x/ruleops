[package]
name = "rf-runner"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
erf-affected-scope = { path = "../affected-scope" }
erf-bundle-cache = { path = "../bundle-cache" }
erf-bundle-delivery = { path = "../bundle-delivery" }
erf-contracts = { path = "../../contracts/rust" }
erf-incremental-baseline = { path = "../incremental-baseline" }
erf-host-client = { path = "../host-client" }
erf-packs = { path = "../packs" }
erf-rule-bundle = { path = "../rule-bundle" }
erf-resolver-client = { path = "../resolver-client" }
erf-scan-plan = { path = "../scan-plan" }
erf-git-scope = { path = "../git-scope" }
rf-gate = { path = "../gate" }
erf-trust = { path = "../trust" }
erf-sandbox = { path = "../sandbox" }
prost = "0.13"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["std"] }

[lib]
name = "rf_runner"
path = "src/main.rs"
