[package]
name = "erf-scan-plan"
version = "0.1.0"
edition = "2021"
description = "Frozen incremental ScanPlan, completeness and result-cache boundary"

[dependencies]
erf-affected-scope = { path = "../affected-scope" }
erf-git-scope = { path = "../git-scope" }
rf-gate = { path = "../gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "erf_scan_plan"
path = "src/lib.rs"
