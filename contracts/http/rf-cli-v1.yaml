apiVersion: rulefactory.io/v1
kind: RfCliContract
version: 1.0.0
status: pilot-ready

purpose: >-
  Freeze the installable, non-interactive Thin Client entrypoint used by local
  and CI scans. The CLI owns configuration and presentation only; rf-runner,
  the verified RuleBundle and the selected Backend/Resolver assets own
  execution authority.

entrypoint:
  command: rf
  requiredInputs:
    - repository
    - .ruleops/config.yaml
    - installedRuntimeRelease
  standardScan:
    requiredArguments:
      - --repo-root
      - --rule-id or --candidate or --delivery-descriptor
    incrementalArguments:
      pair:
        - --base REVISION
        - --head REVISION
      bothRequired: true
      semantics: >-
        rf-runner resolves a read-only ChangedSet, computes the affected Java
        closure, freezes a digest-bound ScanPlan after Workspace resolution,
        and widens to FULL when graph, generated-source, or policy facts are
        not proven. A missing or unverifiable range is an input failure; the
        CLI never guesses HEAD~1 or silently narrows scope.
      planIdentityBinds:
        - repository
        - base
        - head
        - tree
        - ruleBundleDigest
        - policyDigest
        - resolverIdentity
        - backendIdentity
        - runnerIdentity
    deliveryDescriptor:
      option: --delivery-descriptor FILE
      environment: RULEOPS_DELIVERY_DESCRIPTOR
      precedence:
        - command line
        - environment
      schemaVersion: rf-delivery-v1
      candidateCombination: forbidden
      executionLockBinding: required before delivery execution
    runtimeReleaseTrustRoot:
      environment: RULEOPS_RUNTIME_RELEASE_TRUST_ROOT_PEM
      requiredFor: deliveryDescriptor
      purpose: external Ed25519 trust anchor for runtime-manifest.json DSSE verification
      manifestKeyMustMatch: true
    deliveryTrustRoot:
      environment: RULEOPS_DELIVERY_TRUST_ROOT_PUBLIC_KEY_HEX
      requiredFor: deliveryDescriptor
      purpose: external Root anchor for signed delegated RuleBundle/Pack/ExecutionLock keys
      descriptorSelfDeclaredKeys: insufficient
    forbiddenRequirements:
      - internal --host command
      - internal --resolver command
  advancedHarnessOverrides:
    - --host
    - --resolver
    - --runtime-home
  assetNames:
    backendHost: rf-backend-host
    workspaceResolver: rf-workspace-resolver
  assetSearch:
    - explicit runtime home
    - RULEOPS_RUNTIME_HOME
    - installed rf package bin directory
    - PATH
  missingAssetOutcome: INPUT_OR_CONTRACT_ERROR

registry:
  connectionSelection: exactlyOneOfServerOrConnectionProfile
  localServer:
    option: --server URL
    allowed: explicitHttpLiteralLoopbackWithV1Base
    hostnameAndNonLoopback: rejected
  approvedRemote:
    option: --connection-profile FILE
    schemaVersion: rf-connection-profile-v1
    additionalFields: false
    requiredFields: [schemaVersion, approved, endpoint, provenance]
    optionalFields: [bearerTokenEnv, caCertificateFile, clientIdentityPemFile, proxy]
    approved: true
    approvalMeaning: operator-selected configuration from an authorized owner, not publication authority
    endpoint: explicit HTTPS origin with exact /v1 base; no userinfo, query or fragment
    authentication: at least one of bearerTokenEnv or clientIdentityPemFile
    bearerTokenEnv: environment variable NAME only; resolve value at request time; never log
    clientIdentityPemFile: PEM certificate and private-key file reference; never inline key material
    caCertificateFile: optional PEM CA bundle added to platform-independent public roots
    relativeMaterialPaths: relative to profile file directory
    proxy: optional explicit HTTPS proxy origin; no credentials, query or fragment
    ambientProxyDiscovery: false
    redirects: forbidden
    minimumTlsVersion: '1.2'
    certificateAndHostnameValidation: required
    profileMaxBytes: 65536
    materialMaxBytes: 1048576
    endpointDiscovery: forbidden
  list:
    command: rf registry list rules|standards (--server URL | --connection-profile FILE) [--cursor-json JSON_STRING] [--limit N] [--timeout-ms N]
    cursor: opaque string, JSON-encoded as one argv element including NUL; only CLI URL-encodes it
    pageSize: 1..256
    cursorMaxUtf8Bytes: 4096
    timeoutMs: 1..600000
    status: RECEIVED_ONLY
    digestVerification: FORMAT_ONLY
    authority: UNKNOWN
    executableAssetsInstalled: false
  show:
    command: rf registry show rules|standards ID --version VERSION --expected-digest SHA256 (--server URL | --connection-profile FILE) [--timeout-ms N]
    identityBinding: [resourceType, id, version, expectedDigest]
    expectedDigestSource: independent release-system pin with provenance; never copied from registry response
    digestIdentity: canonicalStoreEnvelopeNotRuleBundleDigest
    digestVerification: PIN_MATCH
    authority: UNKNOWN
    executableAssetsInstalled: false
  sync:
    command: rf registry sync rules ID --version VERSION --expected-digest SHA256 --delivery-descriptor FILE --repo-root PATH (--server URL | --connection-profile FILE) [--timeout-ms N]
    selection: explicit immutable version and independent pin; refresh directory to select a newer published version
    automaticLatestResolutionOrSemverGuessing: forbidden
    versionNames: opaque exact registry strings; immutable selection is bound by the independent digest and signed mapping
    delivery: existing rf-delivery-v1 signature, trust, revocation, compatibility and ExecutionLock verification
    mapping:
      field: registryPin
      optionalForScan: true
      requiredForSync: true
      additionalFields: false
      requiredFields: [type, id, version, storeDigest, bundleDigest, descriptorDigest, provenance, signedMapping]
      type: rules
      source: existing release system; no self-generated or registry-response-derived trust
      signedMapping: existing SignedAsset DSSE envelope
      signingRole: registry-mapping-signing
      signingKeyAuthority: existing external delivery trust root delegation
      payload: ASCII erf-registry-delivery-mapping-v1 followed by NUL, then UTF-8 fields type/id/version/storeDigest/bundleDigest/descriptorDigest/provenance each prefixed by an unsigned 8-byte big-endian byte length
      binds: exact rule identity, version, independent store pin, RuleBundle digest and entire canonical delivery descriptor digest
      verification: trust metadata freshness, key role/delegation, mapping signature, payload identity and mapping-subject revocation
      provenanceAuthority: signed provenance identifies source, not Gate/publication approval
    networkPath: selected connection only; descriptor endpoint must match
    destination: descriptor cacheRoot under repo-root; existing immutable digest-addressed bundle cache
    overwritePolicy: IMMUTABLE_DIGEST_ADDRESSED
    cachedAssets: signed RuleBundle bytes in cache; verified Runtime Pack payloads in the supplied descriptor and separately supplied signed ExecutionLock are retained local inputs
    receipt:
      status: CACHED
      authority: UNKNOWN
      digestVerification: PIN_MATCH
      artifactKind: SignedRuleBundle
      fields: [status, authority, digestVerification, artifactKind, bundleDigest, destination, overwritePolicy, offlineAvailable, provenance, registry]
      registry: underlying asset-registry-v1 detail response, not a nested show receipt
      provenanceFields: [descriptor, trustRoot, mapping, executionLock, descriptorDigest, offlineCondition]
    offlineMeaning: cached executable assets at verification time; later scans must reverify trust, freshness and platform
    scanExecuted: false
    authority: UNKNOWN
    noScmPublicationOrGateAuthority: true
  failure:
    status: UNKNOWN
    authority: UNKNOWN
    diagnostics: static CLI codes only, no credentials or untrusted response messages
    exitCode: 3
  acceptanceBoundary: loopback HTTP/HTTPS fixtures only; enterprise remote acceptance requires an authorized real endpoint

configuration:
  file: .ruleops/config.yaml
  schemaVersion: ruleops.config/v1
  precedence:
    - cli
    - environment
    - project
    - defaults
  supportedLanguage: java
  unsupportedLanguageOutcome: INPUT_OR_CONTRACT_ERROR
  scopeFields:
    - modules
    - source_roots
    - test_roots
    - generated_roots
    - vendor_roots
    - include
    - exclude
  identity:
    - effectiveConfigDigest
    - workspaceDescriptorDigest
    - resolvedWorkspaceDescriptorDigest
    - configScanPlanDigest
  identityBinding:
    workspaceDescriptorDigest: deterministic project-config scope projection
    resolvedWorkspaceDescriptorDigest: actual descriptor digest returned by the selected Resolver
  executionModes:
    connected:
      cacheMiss: SERVER_FETCH_REQUIRED
    offline:
      cacheMiss: INCONCLUSIVE
    standalone:
      cacheMiss: INCONCLUSIVE

output:
  formats:
    - text
    - json
    - sarif
  jsonKind: ScanResult
  failureKind: ScanFailure
  sourceUploadDefault: false
  fullFindingUploadDefault: false
  scmCredentials: forbidden
  exitCodes:
    complete: 0
    inputOrContractError: 2
    incompleteOrRuntimeFailure: 3
    trustFailure: 4

packaging:
  manifest: runtime-manifest.json
  entrypoint: rf
  cli: bin/rf-cli
  projectConfig: bin/erf-project-config
  backendHost: bin/rf-backend-host
  workspaceResolver: bin/rf-workspace-resolver
  referencePackageCheck: scripts/ci-neutral-scan-check.sh
  manifestAssetRequirements:
    - digest
    - compatibilityIdentity
    - verification
    - signed DSSE runtime manifest
  referenceFixtureBoundary: fake host/resolver assets are marked REFERENCE_FIXTURE and must be replaced in production
  productionDeliveryFollowUp: '#123: signed RuleBundle delivery/cache, ExecutionLock binding, and production Runtime Pack'
  productionFixturePolicy: REFERENCE_FIXTURE assets and verification.algorithm=none are rejected by production packaging checks

nonGoals:
  - gateApproval
  - exceptionApproval
  - scmWrite
  - sourceUpload
  - clientOwnedScanAuthority

# IDE exposure notes (informational only; existing contract/version unchanged).
# ADR-0178: docs/adr/0178-ide-interaction-boundaries-and-acceptance.md.
# Follow-up implementation and real-IDE acceptance: GitHub issue #139.
# clients/ide-command-map.json lists root rf --help templates in help order.
# It contains UI metadata only, not argument validation, execution policy,
# registered IDE actions, a network protocol, or evidence of working UI.
# D1: completion means a scannable signed bundle via existing delivery/cache;
# directory browsing and PIN_MATCH alone do not complete delivery.
# D2: all templates are discoverable, common workflows first; advanced or
# maintenance actions expose missing installation/environment prerequisites.
# Visibility grants no permission and does not prove executable coverage.
# D3: approved remote security belongs in the CLI, not separate IDE transports;
# do not bypass loopback restrictions or substitute plaintext public access.
# D4: independent pins, rule-to-bundle mappings, descriptors/ExecutionLock and
# external trust roots come from the release/delivery system with provenance.
# A registry store digest is not a bundle digest; response keys are not trust.
# D5: confirm real actor/OWNER and facts; exception scope defaults to the current
# file, with explicit confirmation before widening. Receipts are not approvals.
# D6: VS Code ^1.85.0 and IntelliJ 2024.1/Java 21 are source declarations only;
# actual OS/version/package capabilities and real-IDE acceptance remain unproven.
# Help placeholders are not a complete parser schema: implementations must check
# each actual parser and installed assets before declaring executable coverage.
