syntax = "proto3";

// ERF Backend Host Contract v0 (spec §11.1, ADR-0030).
//
// Transport: length-delimited protobuf frames over stdin/stdout (ADR-0030).
// stdout carries protocol frames ONLY — any non-protocol byte is a fatal
// contract violation. stderr carries structured operational logs.
//
// Versioning: major.minor. A major mismatch refuses execution. Within one
// major, evolution is additive only: published field numbers are never reused
// or re-purposed. Unknown optional fields are ignorable (proto3 semantics);
// cross-minor compatibility is guarded by capability negotiation and the
// golden compatibility tests of the Contract Conformance Suite — senders must
// never depend on a peer acknowledging fields its minor cannot know. A
// required capability that cannot be satisfied fails explicitly (no silent
// degradation).
//
// Governance messages must not use google.protobuf.Any, opaque JSON, or
// backend-private payloads to bypass this contract.
package erf.backend.v0;

option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// Runtime -> Host. First frame on stdout after spawn. The runtime demands a
// protocol major match and lists capabilities it requires; the host must fail
// explicitly rather than degrade silently.
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  // Capabilities the runtime requires; every one must be reported by the host
  // or the host must answer with ProtocolError.UNSUPPORTED_CAPABILITY.
  repeated string required_capabilities = 3;
  // Capabilities the runtime would like but tolerates missing.
  repeated string optional_capabilities = 4;
  // Resource ceilings the runtime imposes; the host must not exceed them.
  Limits limits = 5;
}

// Host -> Runtime. Answer to Hello. major must equal the requested major.
message HelloAck {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string host_name = 3;
  string host_version = 4;
  CapabilityDescriptor capabilities = 5;
  // The limits the host actually enforces (<= the runtime-imposed limits).
  Limits accepted_limits = 6;
}

message CapabilityDescriptor {
  // Language ids the host can analyze, e.g. "java".
  repeated string languages = 1;
  // Boolean capability facts, e.g. "java.ast"=true. Capability ids use
  // dot-notation (<language>.<fact>); a missing fact means the capability is
  // absent. Required capabilities must appear here or the host fails the
  // handshake explicitly.
  map<string, bool> facts = 2;
  // Rule IR kinds this backend can implement, e.g. "SymbolRule".
  repeated string rule_kinds = 3;
  // Engine identity executing the rules (e.g. "pmd-java" / "7.9.0").
  string backend_id = 4;
  string backend_version = 5;
}

message Limits {
  // Maximum frame payload size in bytes, both directions. Frames larger than
  // this are a ProtocolError.OVERSIZED_FRAME.
  uint64 max_frame_bytes = 1;
  // Maximum ExecuteEvent frames a host may emit per execute request.
  uint64 max_events_per_execute = 2;
  // Default deadline for a single request in milliseconds; 0 = no deadline.
  uint64 deadline_ms = 3;
}

// ---------------------------------------------------------------------------
// Envelope: request correlation for every frame in both directions
// ---------------------------------------------------------------------------

message HostEnvelope {
  // Correlation id. Request frames assign it; responses/events must echo the
  // id of the request they belong to. Host-initiated non-correlated frames
  // (only Completion on fatal failure) use 0.
  uint64 correlation_id = 1;
  oneof payload {
    Hello hello = 2;
    HelloAck hello_ack = 3;
    DescribeRequest describe = 4;
    DescribeResponse describe_response = 5;
    PlanRequest plan = 6;
    PlanResponse plan_response = 7;
    ExecuteRequest execute = 8;
    ExecuteEvent execute_event = 9;
    ExecuteComplete execute_complete = 10;
    CancelRequest cancel = 11;
    CancelAck cancel_ack = 12;
    Completion completion = 13;
    ProtocolError error = 14;
  }
}

// ---------------------------------------------------------------------------
// Describe / Plan / Execute / Cancel
// ---------------------------------------------------------------------------

message DescribeRequest {}

message DescribeResponse {
  CapabilityDescriptor capabilities = 1;
}

message AnalysisUnit {
  // Opaque unit identity owned by the runtime ScanPlan (rule x analysis unit).
  string unit_id = 1;
  string language = 2;
  // Repository-relative files this unit binds to (from the
  // WorkspaceDescriptor). The host refines execution per file batch; it must
  // not add, drop or merge units (ADR-0036).
  repeated string files = 3;
  // ATTESTED_BUILD_EXPORT context copied from the WorkspaceDescriptor. The
  // adapter must validate the accompanying digests before using these paths.
  repeated string classpath_entries = 4;
  repeated string build_output_roots = 5;
  string invocation_identity = 6;
  bytes classpath_sha256 = 7;
  bytes build_output_sha256 = 8;
}

// The runtime asks the host to refine the assigned units deterministically.
// The host may NOT add, drop or merge units: the Completeness denominator is
// frozen by the runtime ScanPlan (ADR-0019, ADR-0036).
message PlanRequest {
  repeated AnalysisUnit units = 1;
}

message PlannedUnit {
  string unit_id = 1;
  // Host-local batch grouping (deterministic; e.g. per compilation context).
  string batch_id = 2;
}

enum UnsupportedReason {
  UNSUPPORTED_REASON_UNSPECIFIED = 0;
  UNIT_UNSUPPORTED = 1;      // backend cannot ever execute this unit
  UNIT_NOT_APPLICABLE = 2;   // unit is outside the backend's applicable scope
  PLANNING_ERROR = 3;        // transient host-side error prevented planning
}

message UnsupportedUnit {
  string unit_id = 1;
  UnsupportedReason reason_code = 2;
  string detail = 3;
}

message PlanResponse {
  repeated PlannedUnit planned = 1;
  repeated UnsupportedUnit unsupported = 2;
}

message ExecuteRequest {
  // Subset of PlannedUnit.unit_id values from the accepted PlanResponse.
  repeated string unit_ids = 1;
}

// Terminal event of one execute request: the event stream for the correlated
// request ends here (after a UnitStatus for every requested unit).
message ExecuteComplete {
  // Echoes the number of UnitStatus events emitted for this execute.
  uint64 units_reported = 1;
  // Number of BackendObservation events emitted for this execute.
  uint64 observation_count = 2;
  // SHA-256 of the canonical semantic attempt transcript (ADR-0179).
  bytes attempt_digest = 3;
}

// Streamed Host -> Runtime during execute. Order within one unit is
// meaningful; the runtime binds the full received sequence into the attempt
// transcript digest (ADR-0052).
message ExecuteEvent {
  oneof event {
    BackendObservation observation = 1;
    UnitStatus unit_status = 2;
  }
}

// The per-unit Completeness fact (spec §11.1): exactly one UnitStatus must be
// emitted for every requested unit, and the runtime maps each planned unit to
// exactly one terminal outcome. This message is the completeness accounting —
// it is independent of how many BackendObservations were produced.
message UnitStatus {
  string unit_id = 1;
  UnitOutcome outcome = 2;
  // Structured reason for anything other than EXECUTED.
  UnitFailureReason reason_code = 3;
  string detail = 4;
}

enum UnitFailureReason {
  UNIT_FAILURE_REASON_UNSPECIFIED = 0;
  CANCELLED_BY_RUNTIME = 1;  // cooperative cancellation before completion
  UNIT_DEADLINE_EXCEEDED = 2; // unit deadline elapsed
  UNIT_INTERNAL_ERROR = 3;    // host/engine failure while executing the unit
}

enum UnitOutcome {
  EXECUTED = 0;
  FAILED = 1;
  SKIPPED = 2;
  NOT_APPLICABLE = 3;
}

// ---------------------------------------------------------------------------
// Observations (policy-neutral facts; ADR-0041 typed locations)
// ---------------------------------------------------------------------------

message BackendObservation {
  // RuleIntent identity the observation belongs to (NOT a RuleRelease).
  string rule_id = 1;
  ObservationLocation location = 2;
  // Human-facing diagnostic; never parsed by the runtime.
  string message = 3;
  // Engine-reported severity (e.g. "error"/"warning"). Diagnostic only:
  // policy severity is decided by the runtime from the RuleIntent.
  string engine_severity = 4;
}

// Closed location union binding the observation to verifiable content
// identity. SOURCE_SPAN must bind repository-relative path, blob digest and
// UTF-8 byte range. Out-of-range coordinates, blob mismatch or missing fields
// for the chosen kind are structured observation errors downstream — the host
// must still emit them and let the runtime reject.
message ObservationLocation {
  oneof kind {
    SourceSpan source_span = 1;
    SymbolRef symbol = 2;
    BytecodeMember bytecode_member = 3;
    FileRef file = 4;
  }
}

message SourceSpan {
  string path = 1;          // repository-relative, forward slashes
  bytes blob_sha256 = 2;    // 32-byte binary digest of the exact file content
  uint64 start_byte = 3;    // UTF-8 byte offset, inclusive
  uint64 end_byte = 4;      // exclusive; must be >= start_byte
  uint32 line = 5;          // 1-based diagnostic line (derived, not authoritative)
  uint32 column = 6;        // 1-based diagnostic column
}

message SymbolRef {
  string owner = 1;         // normalized dotted FQN, e.g. java.lang.System
  string name = 2;
  string signature = 3;     // normalized descriptor, e.g. (int)V
}

message BytecodeMember {
  string class_fqn = 1;
  string member = 2;
  // normalized member descriptor; not named "descriptor" to avoid clashing
  // with protobuf's own getDescriptor() in generated Java bindings
  string member_descriptor = 3;
}

message FileRef {
  string path = 1;
  bytes blob_sha256 = 2;
}

// ---------------------------------------------------------------------------
// Completion & cancellation
// ---------------------------------------------------------------------------

// Cooperative cancellation: the runtime sends CancelRequest with the
// correlation id of the running execute; the host stops at the next
// cooperative point, still accounting every affected unit, then answers
// CancelAck followed by Completion(CANCELLED).
message CancelRequest {}

message CancelAck {
  bool accepted = 1;
}

// Terminal frame of the session (or of a fatal failure). Exactly one
// Completion per session; after sending it the host exits 0.
message Completion {
  enum Status {
    COMPLETED = 0;   // all requests answered; completeness facts reported via UnitStatus
    CANCELLED = 1;
    FAILED = 2;      // fatal host-side failure; reason explains
  }
  Status status = 1;
  string reason = 2;
  // Total UnitStatus completeness facts emitted over the whole session.
  uint64 units_reported = 3;
}

message ProtocolError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    MALFORMED_FRAME = 1;          // unparseable protobuf payload
    OVERSIZED_FRAME = 2;          // frame beyond negotiated max_frame_bytes
    PROTOCOL_MAJOR_MISMATCH = 3;  // Hello major differs; refuse execution
    UNSUPPORTED_CAPABILITY = 4;   // required capability cannot be satisfied
    UNCORRELATABLE = 5;           // response correlation id matches no open request
    INTERNAL = 6;                 // host-side failure with structured detail
  }
  Code code = 1;
  string detail = 2;
}
